services:
  # Spring Boot Backend Web Service
  - type: web
    name: password-manager-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://password-manager-frontend.vercel.app,https://password-manager-frontend.onrender.com"
      - key: CREDENTIAL_ENCRYPTION_KEY
        value: "YsAdQ2c3DSj062W4GXRbSZZrFZ4NSQw5r9Oj53IW7WQ="
      - key: JWT_SECRET
        generateValue: true

  # React / Vite Frontend Static Site
  - type: web
    name: password-manager-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
