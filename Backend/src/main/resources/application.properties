spring.application.name=Backend

# Server port (Railway injects PORT env var)
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/passwordmanagerdb?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Keep this stable and private; changing it makes existing credential passwords unreadable.
app.credential-encryption-key=${CREDENTIAL_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# JWT Secret key — use a long random string in production
app.jwt-secret=${JWT_SECRET:super-secret-key-which-is-long-enough-to-be-secure-default-dev}

# CORS allowed origins — comma-separated list of frontend URLs
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Set to true in production (HTTPS); false in local dev
app.cookie-secure=${COOKIE_SECURE:false}

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console (not needed for MySQL)
spring.h2.console.enabled=false