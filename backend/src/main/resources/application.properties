spring.application.name=Backend

# Server port (Cloud platforms inject PORT env var)
server.port=${PORT:8080}

# Database Configuration
# Defaults to self-contained persistent H2 database so the app works out-of-the-box anywhere.
# If an online database is provided (DB_URL, DB_USERNAME, DB_PASSWORD), it automatically connects to it.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/passwordmanagerdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate auto-configures dialect based on the connected database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 console for development/inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Keep this stable and private; changing it makes existing credential passwords unreadable.
app.credential-encryption-key=${CREDENTIAL_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# JWT Secret key — use a long random string in production
app.jwt-secret=${JWT_SECRET:super-secret-key-which-is-long-enough-to-be-secure-default-dev}

# CORS allowed origins — comma-separated list of frontend URLs
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://password-manager-frontend.vercel.app,https://password-manager.onrender.com}

# Set to true in production (HTTPS); false in local dev
app.cookie-secure=${COOKIE_SECURE:false}