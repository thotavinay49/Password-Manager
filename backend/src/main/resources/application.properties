spring.application.name=Backend

# Server port (Cloud platforms inject PORT env var)
server.port=${PORT:8080}

# Aiven Cloud MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://passwordmanager-db-anurag-2ed0.g.aivencloud.com:26360/defaultdb?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate auto-configures dialect based on the connected database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 console when using cloud MySQL
spring.h2.console.enabled=false

# Keep this stable and private; changing it makes existing credential passwords unreadable.
app.credential-encryption-key=${CREDENTIAL_ENCRYPTION_KEY:YsAdQ2c3DSj062W4GXRbSZZrFZ4NSQw5r9Oj53IW7WQ=}

# JWT Secret key — stable key
app.jwt-secret=${JWT_SECRET:super-secret-key-which-is-long-enough-to-be-secure-default-dev}

# CORS allowed origins — comma-separated list of frontend URLs
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://password-manager-frontend.vercel.app,https://password-manager.onrender.com}

# Set to true in production (HTTPS); false in local dev
app.cookie-secure=${COOKIE_SECURE:false}