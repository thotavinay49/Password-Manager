# Local / Default dev profile — persistent storage & cloud DB ready
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/passwordmanagerdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.credential-encryption-key=${CREDENTIAL_ENCRYPTION_KEY:YsAdQ2c3DSj062W4GXRbSZZrFZ4NSQw5r9Oj53IW7WQ=}
app.jwt-secret=${JWT_SECRET:super-secret-key-which-is-long-enough-to-be-secure-default-dev}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.cookie-secure=${COOKIE_SECURE:false}
spring.jpa.show-sql=false
